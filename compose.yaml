name: hp2js-cpi

# Rotate container logs so long-running local stacks do not fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    logging: *logging
    # Clean shutdown avoids crash recovery on restart; parallel queries need >64MB shm.
    stop_grace_period: 30s
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpi_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpi_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-cpi_local}
    ports: ['127.0.0.1:15432:5432']
    # PostgreSQL 18+ images keep data in a versioned subdirectory of this mount, so a
    # future major upgrade can run pg_upgrade --link. A new volume name keeps old 17 data apart.
    volumes: ['postgres18_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:16379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: hp2js-cpi-minio:local
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: server
    logging: *logging
    environment:
      MINIO_BROWSER_REDIRECT_URL: http://localhost:19001
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cpi-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cpi-local-admin-only}
    ports: ['127.0.0.1:19000:9000', '127.0.0.1:19001:9001']
    volumes: ['minio_data:/data']
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  minio-init:
    image: hp2js-cpi-minio-setup:local
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: setup
    logging: *logging
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cpi-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cpi-local-admin-only}
      S3_BUCKET: ${S3_BUCKET:-cpi-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cpi-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cpi-local-files-only}
    depends_on:
      minio: { condition: service_healthy }
  api:
    image: hp2js-cpi-api:dev
    logging: *logging
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./.npmrc
        - action: rebuild
          path: ./packages/tsconfig
        - action: rebuild
          path: ./packages/contracts/package.json
        - action: rebuild
          path: ./packages/contracts/tsconfig.json
        - action: rebuild
          path: ./packages/contracts/tsconfig.build.json
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/api/tsconfig.json
        - action: rebuild
          path: ./docker/api.Dockerfile
        - action: rebuild
          path: ./apps/api/tsconfig.build.json
    init: true
    command: ['pnpm', '--filter', '@cpi/api', 'dev:container']
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpi_local}:${POSTGRES_PASSWORD:-cpi_local_only}@postgres:5432/${POSTGRES_DB:-cpi_local}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cpi-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cpi-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cpi-local-files-only}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PREFIX: ${S3_PREFIX:-evidence/}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Platform administrator}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-CPI Platform <onboarding@resend.dev>}
    ports: ['127.0.0.1:3001:3001']
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./packages/contracts/src:/workspace/packages/contracts/src
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s
  web:
    image: hp2js-cpi-web:dev
    logging: *logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./.npmrc
        - action: rebuild
          path: ./packages/tsconfig
        - action: rebuild
          path: ./packages/contracts/package.json
        - action: rebuild
          path: ./packages/contracts/tsconfig.json
        - action: rebuild
          path: ./packages/contracts/tsconfig.build.json
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/tsconfig.json
        - action: rebuild
          path: ./docker/web.Dockerfile
        - action: rebuild
          path: ./apps/web/vite.config.ts
    init: true
    command: ['pnpm', '--filter', '@cpi/web', 'dev:container']
    environment:
      API_PROXY_TARGET: http://api:3001
    ports: ['127.0.0.1:5180:5180']
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./packages/contracts/src:/workspace/packages/contracts/src
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5180').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s
volumes:
  postgres18_data:
  redis_data:
  minio_data:
