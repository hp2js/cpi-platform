version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node follows the LTS line pinned in package.json engines, .nvmrc and CI; a major
      # move changes all of them together, so Dependabot proposes only 24.x updates.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/platform]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A provider major (azurerm 5) renames and requires arguments; migrate it deliberately.
      - dependency-name: hashicorp/azurerm
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /infra/floci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /infra/floci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
