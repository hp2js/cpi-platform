version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Node follows the LTS line pinned in package.json engines, .nvmrc and CI; a major
      # move changes all of them together, so Dependabot proposes only 24.x updates.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
