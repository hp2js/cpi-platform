# One environment's deployment, called by deploy.yml for staging and then production:
# Terraform apply (state versioned in Azure Storage), then scripts/release.sh (signature
# verification, migrations, new revisions, readiness). The GitHub environment's protection
# rules apply (production: required reviewers, main only).
name: Deploy environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      api_image:
        type: string
        required: true
      web_image:
        type: string
        required: true
    outputs:
      portal_url:
        value: ${{ jobs.deploy.outputs.portal_url }}
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
      url: ${{ steps.terraform.outputs.portal_url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      portal_url: ${{ steps.terraform.outputs.portal_url }}
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars[format('AZURE_CLIENT_ID_DEPLOY_{0}', inputs.environment == 'prod' && 'PROD' || 'STAGING')] }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_admin_email: ${{ vars[format('ADMIN_EMAIL_{0}', inputs.environment == 'prod' && 'PROD' || 'STAGING')] }}
      TF_VAR_alert_emails: ${{ vars[format('ALERT_EMAILS_{0}', inputs.environment == 'prod' && 'PROD' || 'STAGING')] || '[]' }}
      # Inputs reach scripts as variables, never spliced into script text.
      ENVIRONMENT: ${{ inputs.environment }}
      TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: scripts/vault-firewall.sh open "rg-cpi-$ENVIRONMENT"
      - name: Terraform apply
        id: terraform
        working-directory: infra/platform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="envs/$ENVIRONMENT.backend.hcl" \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT"
          terraform plan -input=false -no-color -var-file="envs/$ENVIRONMENT.tfvars" -out=tfplan | tee plan.txt
          terraform apply -input=false -no-color tfplan
          echo "portal_url=$(terraform output -raw portal_url)" >> "$GITHUB_OUTPUT"
          { echo "### Terraform ($ENVIRONMENT)"; echo '```'; grep -E '^(Plan:|No changes)' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: scripts/vault-firewall.sh close "rg-cpi-$ENVIRONMENT"
      - name: Release
        run: scripts/release.sh "$ENVIRONMENT" "$TF_VAR_api_image" "$TF_VAR_web_image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: infra/platform/plan.txt
          retention-days: 90
