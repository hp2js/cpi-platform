# The secure-PR gate. Every scanner writes SARIF (uploaded to code scanning and kept 90 days
# as evidence); one policy (scripts/sarif-gate.mjs, exceptions in security/exceptions.json)
# decides what blocks. Branch protection requires only the "Secure-PR gate" check, which
# fails if any job below failed or the policy finds a blocking result.
name: Security
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # New advisories arrive without code changes.
    - cron: '17 3 * * 1'
permissions:
  contents: read
defaults:
  run:
    # Explicit bash adds -o pipefail, so a failing command before `| tee` fails the step.
    shell: bash
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
env:
  # Code scanning uploads need a token that can write security events; fork PRs do not get one.
  UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  scan:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # SAST: semgrep, eslint (eslint-plugin-security), bandit · SCA: osv · secrets: gitleaks
        # IaC: checkov, tflint, trivy-config
        tool:
          [
            semgrep,
            eslint,
            bandit,
            osv,
            gitleaks,
            checkov,
            tflint,
            trivy-config,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks reads history; elsewhere one commit is enough.
          fetch-depth: ${{ matrix.tool == 'gitleaks' && 0 || 1 }}
          persist-credentials: false
      - if: matrix.tool == 'eslint'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.tool == 'eslint' && 'pnpm' || '' }}
      - if: matrix.tool == 'eslint'
        run: pnpm install --frozen-lockfile && pnpm --filter @cpi/contracts build
      - name: Scan
        run: scripts/security-scan.sh ${{ matrix.tool }}
        env:
          # A pull request is checked commit by commit, so a secret added and then deleted
          # within the PR still blocks until history is rewritten.
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all' }}
          GITHUB_TOKEN: ${{ github.token }}
      # Accepted risks (security/exceptions.json) stay in the evidence SARIF, marked suppressed
      # with their reason, and are left out of the code-scanning upload (upload/), so code
      # scanning's own checks fail only on what the gate would block.
      - run: node scripts/sarif-gate.mjs --suppress-accepted security/reports/${{ matrix.tool }}.sarif
      - if: env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/reports/upload/${{ matrix.tool }}.sarif
          category: ${{ matrix.tool }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-${{ matrix.tool }}
          path: security/reports/${{ matrix.tool }}.sarif
          retention-days: 90

  images:
    name: container images (Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          target: production
          tags: cpi-${{ matrix.app }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - run: |
          scripts/security-scan.sh trivy-image cpi-${{ matrix.app }}:scan
          node scripts/sarif-gate.mjs --suppress-accepted security/reports/trivy-image-cpi-${{ matrix.app }}.sarif
      - if: env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/reports/upload/trivy-image-cpi-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-trivy-image-${{ matrix.app }}
          path: |
            security/reports/trivy-image-cpi-${{ matrix.app }}.sarif
            security/reports/sbom-cpi-${{ matrix.app }}.cdx.json
          retention-days: 90

  gitleaks-regression:
    name: gitleaks regression (gate blocks, then passes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: scripts/security-scan.sh gitleaks-regression
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-regression
          path: security/reports/regression/
          retention-days: 90

  dependency-review:
    # Dependabot's advisory database at PR time: blocks a change that adds a dependency with a
    # high or critical advisory. Dependabot alerts and update PRs cover what is already merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  terraform:
    name: terraform (fmt, validate, plan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for stack in infra/bootstrap infra/platform; do
            terraform -chdir=$stack init -backend=false -input=false -lockfile=readonly >/dev/null
            terraform -chdir=$stack validate
          done
      # Plan staging through OIDC (no stored credentials) once bootstrap has run. No refresh:
      # the PR identity reads resources and state, never Key Vault secrets.
      - if: github.event_name == 'pull_request' && env.UPLOAD_SARIF == 'true' && vars.AZURE_CLIENT_ID_PLAN_PR != ''
        name: Plan staging
        working-directory: infra/platform
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN_PR }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config=envs/staging.backend.hcl \
            -backend-config=storage_account_name=${{ vars.TFSTATE_ACCOUNT }}
          terraform plan -input=false -lock=false -refresh=false -no-color \
            -var-file=envs/staging.tfvars \
            -var api_image=unused -var web_image=unused | tee plan.txt
          { echo '### Terraform plan (staging)'; echo '```'; grep -E '^(Plan:|No changes)' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Secure-PR gate
    if: always()
    needs: [scan, images, gitleaks-regression, dependency-review, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sarif-*
          path: security/reports
          merge-multiple: true
      - name: Apply the merge policy
        if: always()
        run: node scripts/sarif-gate.mjs security/reports/*.sarif --summary "$GITHUB_STEP_SUMMARY" | tee security/reports/gate.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: secure-pr-gate-evidence
          path: |
            security/reports/
            security/exceptions.json
          retention-days: 90
      # Last, so the evidence above is uploaded even when a scanner job failed.
      - name: Every scanner ran
        if: always()
        # Skipped is allowed (dependency review runs on pull requests only); failed is not.
        run: |
          echo '${{ toJSON(needs) }}' |
            jq -e 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | if length > 0 then (map(.key + ": " + .value.result) | join("\n") | halt_error) else true end'
