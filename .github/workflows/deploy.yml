# Continuous delivery from main: build once, scan, sign, deploy staging, DAST staging, then
# promote the same signed digests to production after a reviewer approves.
#
#   build ──► staging ──► dast ──► production (GitHub environment approval)
#
# Images: GitHub Container Registry (public, like the repository; Azure pulls without
# credentials), Trivy (fixable high/critical CVEs and secrets block), CycloneDX SBOM attested
# with Cosign, keyless signatures bound to this workflow on main. Rollback: rollback.yml.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # One deployment at a time, and never cancel one half-way.
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Push to GitHub Container Registry with this job's own token; sign keylessly (OIDC).
      packages: write
      id-token: write
      security-events: write
    env:
      IMAGES: ghcr.io/${{ github.repository }}
    outputs:
      api: ${{ steps.publish.outputs.api }}
      web: ${{ steps.publish.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: production
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGES }}/api:${{ github.sha }}
          # Links the package to this repository (its access and visibility).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          target: production
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGES }}/web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan, then sign and attest the SBOM
        id: publish
        env:
          API: ${{ env.IMAGES }}/api@${{ steps.api.outputs.digest }}
          WEB: ${{ env.IMAGES }}/web@${{ steps.web.outputs.digest }}
        run: |
          scripts/security-scan.sh trivy-image "$API"
          scripts/security-scan.sh trivy-image "$WEB"
          node scripts/sarif-gate.mjs --suppress-accepted security/reports/trivy-image-*.sarif
          node scripts/sarif-gate.mjs security/reports/trivy-image-*.sarif --summary "$GITHUB_STEP_SUMMARY"
          for image in "$API" "$WEB"; do
            name=$(basename "${image%%@*}")
            cosign sign --yes "$image"
            cosign attest --yes --type cyclonedx --predicate "security/reports/sbom-$name.cdx.json" "$image"
          done
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: security/reports/upload/trivy-image-api.sarif
          category: release-image-api
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: security/reports/upload/trivy-image-web.sarif
          category: release-image-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: security/reports/
          retention-days: 90

  staging:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      api_image: ${{ needs.build.outputs.api }}
      web_image: ${{ needs.build.outputs.web }}

  dast:
    name: DAST (ZAP baseline, staging)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: |
          scripts/security-scan.sh zap "$PORTAL_URL"
          node scripts/sarif-gate.mjs --suppress-accepted security/reports/zap.sarif
        env:
          PORTAL_URL: ${{ needs.staging.outputs.portal_url }}
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: security/reports/upload/zap.sarif
          category: zap-staging
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dast-evidence-${{ github.sha }}
          path: security/reports/
          retention-days: 90
      - name: High-risk DAST alerts block promotion
        run: node scripts/sarif-gate.mjs security/reports/zap.sarif --summary "$GITHUB_STEP_SUMMARY"

  production:
    needs: [build, dast]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      api_image: ${{ needs.build.outputs.api }}
      web_image: ${{ needs.build.outputs.web }}
