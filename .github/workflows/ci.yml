name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium runs every journey; Firefox and WebKit (Safari's engine) run the core ones.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm format:check
      - run: pnpm check
      - name: Lint Dockerfiles
        run: |
          for file in docker/*.Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$file"
          done
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: pnpm test:smoke
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: docker compose -f compose.yaml -f compose.production.yaml up --build --wait --wait-timeout 180
      - run: pnpm test:smoke
      - run: pnpm test:e2e:prod
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color --tail=200 > artifacts/compose.log 2>&1
          docker compose ps --all > artifacts/compose-status.txt 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
