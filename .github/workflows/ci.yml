name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm check
      - name: Lint Dockerfiles
        run: |
          for file in docker/*.Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$file"
          done
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: pnpm test:smoke
      - run: pnpm test:e2e
      - run: docker compose -f compose.yaml -f compose.production.yaml up --build --wait --wait-timeout 180
      - run: pnpm test:smoke
      - run: pnpm test:e2e:prod
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color --tail=200 > artifacts/compose.log 2>&1
          docker compose ps --all > artifacts/compose-status.txt 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-diagnostics
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
